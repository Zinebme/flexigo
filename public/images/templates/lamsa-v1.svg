<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LAMSA desktop storefront preview</title>
  <desc id="desc">Premium Arabic modest-fashion storefront in ivory, chocolate and muted gold.</desc>
  <defs>
    <clipPath id="hero"><rect x="80" y="170" width="800" height="470"/></clipPath>
    <clipPath id="p1"><rect x="80" y="745" width="210" height="210"/></clipPath>
    <clipPath id="p2"><rect x="315" y="745" width="210" height="210"/></clipPath>
    <clipPath id="p3"><rect x="550" y="745" width="210" height="210"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FAF7F2" stop-opacity="0"/><stop offset="1" stop-color="#FAF7F2"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#FAF7F2"/>
  <rect width="1600" height="42" fill="#4A382F"/>
  <text x="800" y="28" text-anchor="middle" fill="#FAF7F2" font-family="Arial,sans-serif" font-size="15">توصيل إلى 58 ولاية  •  الدفع عند الاستلام</text>
  <rect y="42" width="1600" height="98" fill="#FFFDF9"/>
  <line y1="140" x2="1600" y2="140" stroke="#DDD2C6"/>
  <text x="1450" y="102" text-anchor="end" fill="#4A382F" font-family="Arial,sans-serif" font-size="35" font-weight="700">لمسة</text>
  <g fill="#4A382F" font-family="Arial,sans-serif" font-size="17"><text x="1210" y="99">الرئيسية</text><text x="1080" y="99">وصل حديثاً</text><text x="930" y="99">المجموعات</text><text x="785" y="99">الأكثر طلباً</text><text x="655" y="99">العروض</text></g>
  <circle cx="128" cy="91" r="19" fill="none" stroke="#4A382F" stroke-width="2"/><path d="M119 91h18M128 82v18" stroke="#4A382F" stroke-width="2"/>
  <image href="/images/lamsa/hero.jpg" x="80" y="170" width="800" height="470" preserveAspectRatio="xMidYMid slice" clip-path="url(#hero)"/>
  <rect x="760" y="170" width="200" height="470" fill="url(#fade)"/>
  <text x="1490" y="285" text-anchor="end" fill="#B79B6C" font-family="Arial,sans-serif" font-size="17" font-weight="700">مجموعة الموسم</text>
  <text x="1490" y="365" text-anchor="end" fill="#4A382F" font-family="Arial,sans-serif" font-size="57" font-weight="700">أناقتك تبدأ</text>
  <text x="1490" y="432" text-anchor="end" fill="#4A382F" font-family="Arial,sans-serif" font-size="57" font-weight="700">من التفاصيل</text>
  <text x="1490" y="487" text-anchor="end" fill="#756A63" font-family="Arial,sans-serif" font-size="20">تصاميم مختارة تجمع بين الأناقة والراحة والاحتشام</text>
  <rect x="1278" y="530" width="212" height="60" fill="#4A382F"/><text x="1384" y="568" text-anchor="middle" fill="#FFF" font-family="Arial,sans-serif" font-size="19" font-weight="700">اكتشفي المجموعة</text>
  <text x="1490" y="705" text-anchor="end" fill="#4A382F" font-family="Arial,sans-serif" font-size="34" font-weight="700">وصل حديثاً</text>
  <text x="1490" y="735" text-anchor="end" fill="#9D8C7B" font-family="Arial,sans-serif" font-size="16">قطع جديدة اختيرت لترافقكِ بأناقة كل يوم</text>
  <g>
    <image href="/images/lamsa/abaya.jpg" x="80" y="745" width="210" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#p1)"/>
    <image href="/images/lamsa/khimar.jpg" x="315" y="745" width="210" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#p2)"/>
    <image href="/images/lamsa/hijab.jpg" x="550" y="745" width="210" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#p3)"/>
    <rect x="785" y="745" width="210" height="210" fill="#E7DDD1"/><rect x="1018" y="745" width="210" height="210" fill="#D4C5B7"/><rect x="1253" y="745" width="237" height="210" fill="#B9A795"/>
  </g>
