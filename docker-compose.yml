version: "3.9"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    # If using Hostinger VPS with Traefik:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.flexigo.rule=Host(`flexigo.com`) || HostRegexp(`{subdomain:[a-z0-9-]+}.flexigo.com`)"
    #   - "traefik.http.routers.flexigo.entrypoints=websecure"
    #   - "traefik.http.routers.flexigo.tls.certresolver=myresolver"

